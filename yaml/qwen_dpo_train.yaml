### model
model_name_or_path: /hrct_report_generation_video_vlm/model/Qwen2.5-VL-7B-Instruct
template: qwen2_vl
trust_remote_code: true

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all  

### DPO 
pref_beta: 1 
pref_loss: sigmoid   #sigmoid (dpo), orpo, simpo

### vision config
video_fps: 7
video_max_pixels: 40000
image_max_pixels: 262144

### dataset
dataset: dpo_ab_train   # name from dataset_info.json
dataset_dir: /hrct_report_generation_video_vlm/data
media_dir: /hrct_report_generation_video_vlm/example_data

cutoff_len: 8192
max_samples: 50000
overwrite_cache: true
preprocessing_num_workers: 32 
dataloader_num_workers: 4 


### output
output_dir: /hrct_report_generation_video_vlm/output/qwen_dpo
logging_steps: 10
save_steps: 1000
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
