# Base Model
model_name_or_path: /hrct_report_generation_video_vlm/model/Qwen2.5-VL-7B-Instruct

trust_remote_code: true

# Method
stage: sft
do_train: true
finetuning_type: lora 
template: qwen2_vl

# Vision Config
video_fps: 7
video_max_pixels: 40000
image_max_pixels: 262144 

# Dataset
dataset: sft_ab_train
dataset_dir: /hrct_report_generation_video_vlm/data
media_dir: /hrct_report_generation_video_vlm/example_data

cutoff_len: 8192
max_samples: 50000        # number of train videos
overwrite_cache: true
preprocessing_num_workers: 16      #16
gradient_checkpointing: true

# Output
output_dir: /hrct_report_generation_video_vlm/output/qwen_ab
logging_steps: 10
save_steps: 1000
plot_loss: true
overwrite_output_dir: false

# Training
per_device_train_batch_size: 1 
gradient_accumulation_steps: 4
learning_rate: 0.00004 
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true

# LoRA
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all

freeze_vision_tower: false

ddp_timeout: 180000000